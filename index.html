<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legend App | Get it on the App Store</title>
  <meta name="description" content="Download the Legend iPhone app on the App Store." />
  <meta name="theme-color" content="#f0eee6" />
  <link rel="canonical" href="https://app.legendmemory.ai/" />
  <link rel="icon" href="assets/icon.png" type="image/png" />

  <!--
    ============================================================
    APP STORE REDIRECT CONFIG
    Leave APP_STORE_URL empty to show this holding page.
    Set APP_STORE_URL to your App Store link (one line) to
    auto-redirect visitors once the app is approved.
    Example:
      const APP_STORE_URL = "https://apps.apple.com/app/idXXXXXXXX";
    ============================================================
  -->
  <script>
    // ONE-LINE SWITCH: empty = holding page; set URL = redirect
    const APP_STORE_URL = "https://apps.apple.com/us/app/legend-memory-ai-pendant/id6751127555";

    if (APP_STORE_URL && APP_STORE_URL.trim() !== "") {
      window.location.replace(APP_STORE_URL);
      document.write(
        '<meta http-equiv="refresh" content="0;url=' +
          APP_STORE_URL.replace(/"/g, "") +
          '" />'
      );
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://apps.apple.com/us/app/legend-memory-ai-pendant/id6751127555" />
  </noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Matched from legendmemory.ai Shopify color scheme */
      --bg: #f0eee6;              /* color-base-background 240 238 230 */
      --text: #171717;            /* color-base-text 23 23 23 */
      --muted: rgba(23, 23, 23, 0.62);
      --highlight: #e5d091;       /* color-base-highlight 229 208 145 */
      --button: #150704;          /* color-base-button */
      --button-text: #f8f8f6;     /* color-base-button-text */
      --card: #ffffff;
      --border: rgba(23, 23, 23, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Lato, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1.25rem 1.25rem;
      text-align: center;
    }

    .logo {
      display: block;
      height: 30px;
      width: auto;
      margin: 0 auto 1rem;
    }

    @media (min-width: 480px) {
      .logo { height: 34px; }
    }

    h1 {
      font-size: clamp(1.45rem, 4.6vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      max-width: 22ch;
      margin: 0 auto 0.5rem;
    }

    .lead {
      max-width: 30rem;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      color: var(--muted);
      margin: 0 auto 1.1rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 20rem;
      margin: 1rem auto 0;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      background: #150704;
      color: #f8f8f6;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .cta:hover { opacity: 0.9; }
    .cta:active { transform: scale(0.98); }
    .cta:focus-visible { outline: 2px solid #e5d091; outline-offset: 3px; }

    @media (min-width: 480px) {
      .cta { width: auto; min-width: 13rem; }
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: rgba(23, 23, 23, 0.45);
    }

    footer a {
      color: rgba(23, 23, 23, 0.55);
      text-decoration: none;
    }

    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="https://legendmemory.ai" aria-label="Legend Memory">
      <img
        class="logo"
        src="assets/logo.png"
        width="200"
        height="44"
        alt="Legend"
      />
    </a>

    <h1>Get Legend for iPhone</h1>
    <p class="lead">
      Opening the App Store. If you are not redirected, use the link below.
    </p>

    <a
      class="cta"
      href="https://apps.apple.com/us/app/legend-memory-ai-pendant/id6751127555"
    >Open in the App Store</a>

    <footer>
      <p>&copy; <span id="y"></span> Legend Memory &middot; <a href="https://legendmemory.ai">legendmemory.ai</a></p>
    </footer>
  </main>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
